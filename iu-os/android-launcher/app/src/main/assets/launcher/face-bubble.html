<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>IU Face Bubble</title>
  <link rel="stylesheet" href="./face-bubble.css">
</head>
<body>
  <button id="face-bubble-btn" class="face-bubble" type="button" aria-label="Abrir homescreen">
    <div class="face-shell">
      <svg id="face-bubble-svg" viewBox="90 135 220 220" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="translate(200, 250)">
          <g>
            <path id="left-eyebrow" class="face-stroke" d="M -88 -92 C -66 -104 -44 -102 -24 -88" />
            <path id="right-eyebrow" class="face-stroke" d="M 24 -88 C 44 -102 66 -104 88 -92" />
          </g>
          <g>
            <path class="face-stroke" d="M -62 -32 L -62 28" />
            <path class="face-stroke" d="M 62 -32 L 62 28" />
          </g>
          <g>
            <path class="face-stroke" d="M -58 108 C -26 132 26 132 58 108" />
          </g>
        </g>
      </svg>
    </div>
  </button>

  <script src="./face-bubble.js"></script>
</body>
</html>
