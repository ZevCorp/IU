<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ü Hands Base</title>
  <style>
    :root {
      --bg: rgba(6, 8, 12, 0.82);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f4f7ff;
      --muted: #a4b0c7;
      --accent: #4ef0ff;
      --accent2: #ff8fc7;
      --ok: #5cff99;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "SF Pro Text", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
    }

    #shell {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: radial-gradient(120% 120% at 0% 0%, rgba(78, 240, 255, 0.15) 0%, transparent 40%),
        radial-gradient(120% 120% at 100% 100%, rgba(255, 143, 199, 0.12) 0%, transparent 40%), var(--bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 360ms ease;
    }

    #shell.visible {
      opacity: 1;
    }

    #titlebar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
      background: rgba(12, 14, 20, 0.35);
    }

    #title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.95;
    }

    #dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
      opacity: 0.35;
      transition: opacity 120ms ease;
    }

    #dot.active {
      opacity: 1;
    }

    .btn {
      -webkit-app-region: no-drag;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      height: 24px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11px;
      padding: 0 8px;
    }

    #hide-btn {
      width: 24px;
      padding: 0;
      font-size: 14px;
      line-height: 20px;
    }

    #actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #stage {
      position: relative;
      width: 100%;
      height: calc(100% - 42px);
    }

    #video,
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #video {
      object-fit: cover;
      transform: scaleX(-1);
      filter: saturate(1.08) contrast(1.04);
      opacity: 0.28;
    }

    #canvas {
      pointer-events: none;
    }

    #hud {
      position: absolute;
      left: 10px;
      bottom: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      background: rgba(6, 8, 12, 0.46);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 9px;
    }

    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      color: #ffd6d6;
      display: none;
      text-align: center;
      width: 80%;
    }
  </style>
</head>

<body>
  <div id="shell">
    <div id="titlebar">
      <div id="title">
        <span id="dot"></span>
        <span>Ü Hands Base</span>
      </div>
      <div id="actions">
        <button id="fluid-btn" class="btn">fluid window</button>
        <button id="hide-btn" class="btn" aria-label="Hide">×</button>
      </div>
    </div>
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div id="hud">
        <span id="status">Initializing...</span>
        <span id="meta">0 hands • 0 fps</span>
      </div>
      <div id="error"></div>
    </div>
  </div>

  <script type="module">
    import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const shell = document.getElementById('shell');
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');
    const dot = document.getElementById('dot');
    const errorEl = document.getElementById('error');
    const hideBtn = document.getElementById('hide-btn');
    const fluidBtn = document.getElementById('fluid-btn');

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20],
      [0, 17]
    ];

    let handLandmarker = null;
    let rafId = null;
    let frameCount = 0;
    let fps = 0;
    let fpsTs = performance.now();
    let lastPublishTs = 0;
    let lastLandmarksTs = 0;
    let handsVisible = false;
    let lastPresenceSent = null;
    let handsLostAt = 0;
    let lastWaveDirection = 0;
    let lastWaveFlipAt = 0;
    let waveActiveUntil = 0;
    let waveFilteredX = 0.5;
    let waveInitialized = false;

    const pinch = {
      active: false,
      strength: 0,
      filteredX: 0.5,
      filteredY: 0.5,
      wasInitialized: false,
      startThreshold: 0.28,
      endThreshold: 0.4,
      emaAlpha: 0.2,
      stabilityFrames: 0
    };

    function setStatus(text, active = false) {
      statusEl.textContent = text;
      dot.classList.toggle('active', active);
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = 'block';
      setStatus('Camera unavailable', false);
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawSkeleton(result) {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);

      if (!result?.landmarks?.length) return 0;

      const hands = result.landmarks;
      const handednessList = result.handedness || [];

      for (let h = 0; h < hands.length; h += 1) {
        const landmarks = hands[h];
        const handLabel = handednessList[h]?.[0]?.categoryName || 'Hand';
        const color = handLabel === 'Left' ? '#4ef0ff' : '#ff8fc7';

        ctx.lineWidth = 2;
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.95;

        for (const [sIdx, eIdx] of HAND_CONNECTIONS) {
          const s = landmarks[sIdx];
          const e = landmarks[eIdx];
          if (!s || !e) continue;

          const sx = (1 - s.x) * width;
          const sy = s.y * height;
          const ex = (1 - e.x) * width;
          const ey = e.y * height;

          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(ex, ey);
          ctx.stroke();
        }

        for (let i = 0; i < landmarks.length; i += 1) {
          const p = landmarks[i];
          const x = (1 - p.x) * width;
          const y = p.y * height;
          const isTip = [4, 8, 12, 16, 20].includes(i);

          ctx.beginPath();
          ctx.fillStyle = isTip ? '#ffffff' : color;
          ctx.globalAlpha = isTip ? 1 : 0.9;
          ctx.arc(x, y, isTip ? 4.2 : 2.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      return hands.length;
    }

    function handlePinchDrag(result) {
      const hands = result?.landmarks || [];
      if (hands.length === 0) {
        if (pinch.active && window.iuOS?.pinchDragMainWindow) {
          window.iuOS.pinchDragMainWindow({ phase: 'end' });
        }
        pinch.active = false;
        pinch.stabilityFrames = 0;
        return;
      }

      const landmarks = hands[0];
      const thumb = landmarks[4];
      const index = landmarks[8];
      const middleMcp = landmarks[9];
      const wrist = landmarks[0];
      if (!thumb || !index || !middleMcp || !wrist) return;

      const pinchDist = Math.hypot(index.x - thumb.x, index.y - thumb.y, index.z - thumb.z);
      const handScale = Math.max(0.03, Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y, middleMcp.z - wrist.z));
      const normalized = pinchDist / handScale;

      const shouldStart = normalized < pinch.startThreshold;
      const shouldEnd = normalized > pinch.endThreshold;

      pinch.strength = Math.max(0, Math.min(1, 1 - ((normalized - 0.18) * 2.8)));

      const xRaw = 1 - ((thumb.x + index.x) * 0.5);
      const yRaw = ((thumb.y + index.y) * 0.5);

      if (!pinch.wasInitialized) {
        pinch.filteredX = xRaw;
        pinch.filteredY = yRaw;
        pinch.wasInitialized = true;
      } else {
        pinch.filteredX += (xRaw - pinch.filteredX) * pinch.emaAlpha;
        pinch.filteredY += (yRaw - pinch.filteredY) * pinch.emaAlpha;
      }

      if (!window.iuOS?.pinchDragMainWindow) return;

      if (!pinch.active && shouldStart) {
        pinch.stabilityFrames += 1;
        if (pinch.stabilityFrames >= 2) {
          pinch.active = true;
          window.iuOS.pinchDragMainWindow({
            phase: 'start',
            xNorm: pinch.filteredX,
            yNorm: pinch.filteredY,
            strength: pinch.strength
          });
        }
      } else if (pinch.active) {
        if (shouldEnd) {
          pinch.active = false;
          pinch.stabilityFrames = 0;
          window.iuOS.pinchDragMainWindow({ phase: 'end' });
        } else {
          window.iuOS.pinchDragMainWindow({
            phase: 'move',
            xNorm: pinch.filteredX,
            yNorm: pinch.filteredY,
            strength: pinch.strength
          });
        }
      } else {
        pinch.stabilityFrames = Math.max(0, pinch.stabilityFrames - 1);
      }
    }

    function detectPalmOpen(result) {
      const hands = result?.landmarks || [];
      if (!hands.length) return false;
      const hand = hands[0];
      if (!hand || hand.length < 21) return false;

      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      let extended = 0;
      for (let i = 0; i < tips.length; i += 1) {
        const tip = hand[tips[i]];
        const pip = hand[pips[i]];
        if (tip && pip && tip.y < pip.y) extended += 1;
      }
      return extended >= 3;
    }

    /**
     * Strict fist: ALL 4 fingers curled — tip below its PIP joint.
     * Uses PIP (same reference as detectPalmOpen) not MCP, which is more
     * reliable and correctly mirrors how palmOpen works.
     * A single raised finger returns false. Thumb is excluded (position
     * varies widely by hand shape and camera angle).
     */
    function detectStrictFist(result) {
      const hands = result?.landmarks || [];
      if (!hands.length) return false;
      const hand = hands[0];
      if (!hand || hand.length < 21) return false;

      // Index, Middle, Ring, Pinky: tip must be BELOW its PIP (larger y = lower on screen)
      // This mirrors detectPalmOpen (which returns true when 3+ tips are ABOVE their PIPs)
      const fingerTips = [8, 12, 16, 20]; // index, middle, ring, pinky tips
      const fingerPips = [6, 10, 14, 18]; // their corresponding PIP joints
      for (let i = 0; i < fingerTips.length; i += 1) {
        const tip = hand[fingerTips[i]];
        const pip = hand[fingerPips[i]];
        if (!tip || !pip) return false;
        // For a closed finger: tip.y > pip.y (tip is lower / closer to palm)
        // No tolerance needed — same scale as detectPalmOpen
        if (tip.y <= pip.y) return false; // this finger is not curled
      }

      return true;
    }

    function detectWaveGesture(result, now) {
      const hands = result?.landmarks || [];
      if (!hands.length) return false;

      const hand = hands[0];
      if (!hand || hand.length < 21) return false;
      const wrist = hand[0];
      const middleMcp = hand[9];
      if (!wrist || !middleMcp) return false;

      const palmX = ((wrist.x + middleMcp.x) * 0.5);
      const palmOpen = detectPalmOpen(result);
      if (!palmOpen) return now < waveActiveUntil;

      if (!waveInitialized) {
        waveFilteredX = palmX;
        waveInitialized = true;
      }
      const dx = palmX - waveFilteredX;
      waveFilteredX += dx * 0.3;

      const dir = dx > 0.01 ? 1 : (dx < -0.01 ? -1 : 0);
      if (dir !== 0 && lastWaveDirection !== 0 && dir !== lastWaveDirection) {
        const dt = now - lastWaveFlipAt;
        if (dt < 420) {
          waveActiveUntil = now + 450;
        }
      }
      if (dir !== 0) {
        lastWaveDirection = dir;
        lastWaveFlipAt = now;
      }

      return now < waveActiveUntil;
    }

    function publishLandmarks(result, now) {
      if (!window.iuOS?.publishHandsLandmarks) return;
      if (now - lastLandmarksTs < 45) return;
      lastLandmarksTs = now;

      const hands = (result?.landmarks || []).map((hand) => hand.map((p) => ({ x: p.x, y: p.y, z: p.z })));
      window.iuOS.publishHandsLandmarks({
        timestamp: Date.now(),
        hands
      });
    }

    function updatePresence(handsCount) {
      const now = performance.now();

      if (handsCount > 0) {
        handsVisible = true;
        handsLostAt = 0;
        shell.classList.add('visible');
      } else if (!handsLostAt) {
        handsLostAt = now;
      }

      if (handsLostAt && now - handsLostAt > 650) {
        handsVisible = false;
        shell.classList.remove('visible');
      }

      if (lastPresenceSent !== handsVisible && window.iuOS?.publishHandsPresence) {
        lastPresenceSent = handsVisible;
        window.iuOS.publishHandsPresence(handsVisible);
      }
    }

    async function init() {
      hideBtn.addEventListener('click', () => window.iuOS?.toggleHandWindow?.());
      fluidBtn.addEventListener('click', () => window.iuOS?.toggleHandFluidWindow?.());

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      try {
        setStatus('Loading hand model...');
        const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm');

        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numHands: 2,
          minHandDetectionConfidence: 0.6,
          minHandPresenceConfidence: 0.6,
          minTrackingConfidence: 0.65
        });

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 960, height: 720, facingMode: 'user' },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        setStatus('Pinch drag active', true);
        loop();
      } catch (error) {
        console.error('[Hands] init failed:', error);
        showError('No se pudo iniciar cámara o modelo de manos. Revisa permisos de cámara.');
      }
    }

    function loop() {
      if (!handLandmarker || video.readyState < 2) {
        rafId = requestAnimationFrame(loop);
        return;
      }

      const now = performance.now();
      const result = handLandmarker.detectForVideo(video, now);

      const handsCount = drawSkeleton(result);
      handlePinchDrag(result);
      publishLandmarks(result, now);
      updatePresence(handsCount);
      const palmOpen = detectPalmOpen(result);
      const strictFist = detectStrictFist(result);
      const waveGesture = detectWaveGesture(result, now);

      frameCount += 1;
      const elapsed = now - fpsTs;
      if (elapsed >= 1000) {
        fps = Math.round((frameCount * 1000) / elapsed);
        frameCount = 0;
        fpsTs = now;
      }

      metaEl.textContent = `${handsCount} hands • ${fps} fps • pinch ${Math.round(pinch.strength * 100)}%${strictFist ? ' • ✊ fist' : ''}${palmOpen ? ' • 🖐 open' : ''}${waveGesture ? ' • wave' : ''}`;

      if (now - lastPublishTs > 90 && window.iuOS?.publishHandsFrame) {
        lastPublishTs = now;
        window.iuOS.publishHandsFrame({
          timestamp: Date.now(),
          handsCount,
          fps,
          pinch: pinch.strength,
          pinchActive: pinch.active,   // true = pinch drag is locked in
          palmOpen,
          strictFist,
          waveGesture
        });
      }

      rafId = requestAnimationFrame(loop);
    }

    window.addEventListener('beforeunload', () => {
      if (rafId) cancelAnimationFrame(rafId);
      const stream = video.srcObject;
      if (stream) {
        for (const track of stream.getTracks()) track.stop();
      }
      window.iuOS?.pinchDragMainWindow?.({ phase: 'end' });
      window.iuOS?.publishHandsPresence?.(false);
    });

    init();
  </script>
</body>

</html>
