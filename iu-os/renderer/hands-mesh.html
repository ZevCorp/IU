<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Ü Hand Mesh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #stage {
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 400ms ease;
    }

    #stage.visible { opacity: 1; }

    canvas { display: block; }
  </style>
</head>

<body>
  <div id="stage"></div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';

    const stage = document.getElementById('stage');

    // ── Constants ────────────────────────────────────────────────────────────
    const SCALE     = 18;
    const MAX_HANDS = 2;

    // Each finger: landmark indices from MCP to tip.
    // Wrist (0) is prepended at runtime to root each tube at the wrist.
    const FINGERS = [
      { idx: [1,  2,  3,  4],  r: 0.34 },  // Thumb
      { idx: [5,  6,  7,  8],  r: 0.42 },  // Index
      { idx: [9,  10, 11, 12], r: 0.44 },  // Middle
      { idx: [13, 14, 15, 16], r: 0.40 },  // Ring
      { idx: [17, 18, 19, 20], r: 0.32 },  // Pinky
    ];

    // Palm surface: columns = thumb-MCP → pinky-MCP, rows = wrist → MCPs
    const PALM_COLS  = 5;   // landmark columns: [1,5,9,13,17]
    const PALM_ROWS  = 5;   // grid rows from near-wrist to MCP level
    const PALM_LMS   = [1, 5, 9, 13, 17];

    // ── Scene ────────────────────────────────────────────────────────────────
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
    camera.position.set(0, 0, 24);

    const renderer = new THREE.WebGLRenderer({
      alpha:           true,
      antialias:       true,
      powerPreference: 'low-power',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    stage.appendChild(renderer.domElement);

    // ── Lighting ─────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x334466, 1.6));
    const keyLight = new THREE.DirectionalLight(0x4488cc, 2.2);
    keyLight.position.set(3, 6, 10);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x112244, 1.0);
    rimLight.position.set(-4, -5, -8);
    scene.add(rimLight);

    // ── Materials ────────────────────────────────────────────────────────────
    // Semi-transparent inner face — DoubleSide so back faces show through
    const faceMat = new THREE.MeshPhysicalMaterial({
      color:       0x0a2040,
      transparent: true,
      opacity:     0.28,
      side:        THREE.DoubleSide,
      roughness:   0.0,
      depthWrite:  false,   // See through all layers (hollow-cast look)
    });

    // Bright wireframe drawn on top (same geometry, wireframe mode)
    const wireMat = new THREE.MeshBasicMaterial({
      color:       0x5ce8ff,
      wireframe:   true,
      transparent: true,
      opacity:     0.82,
    });

    // ── Helper: map MediaPipe landmark → 3D point ────────────────────────────
    function mv(p) {
      return new THREE.Vector3(
        (0.5 - p.x) * SCALE,
        (0.5 - p.y) * SCALE * 1.05,
        (p.z || 0)  * SCALE * 2.2
      );
    }

    // ── Placeholder geometry (prevents WebGL errors before first update) ─────
    function makeDummy() {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(9), 3));
      g.setIndex([0, 1, 2]);
      return g;
    }

    // ── Palm grid geometry (pre-allocated, only positions change) ────────────
    function buildPalmGeom() {
      const n        = PALM_ROWS * PALM_COLS;
      const verts    = new Float32Array(n * 3);
      const indices  = [];

      for (let r = 0; r < PALM_ROWS - 1; r++) {
        for (let c = 0; c < PALM_COLS - 1; c++) {
          const a = r * PALM_COLS + c;
          const b = a + 1;
          const d = (r + 1) * PALM_COLS + c;
          const e = d + 1;
          indices.push(a, d, b,  b, d, e);
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
      geom.setIndex(indices);
      return { geom, verts };
    }

    // ── Per-hand pool ────────────────────────────────────────────────────────
    function buildPool() {
      // Finger tube meshes
      const tubes = FINGERS.map(() => {
        const dummy = makeDummy();
        const solid = new THREE.Mesh(dummy, faceMat);
        const wire  = new THREE.Mesh(dummy, wireMat);
        solid.add(wire);
        solid.visible = false;
        scene.add(solid);
        return { solid, wire, _g: null };
      });

      // Palm surface mesh
      const { geom: pGeom, verts: pVerts } = buildPalmGeom();
      const palmSolid = new THREE.Mesh(pGeom, faceMat);
      const palmWire  = new THREE.Mesh(pGeom, wireMat);
      palmSolid.add(palmWire);
      palmSolid.visible = false;
      scene.add(palmSolid);

      return { tubes, palmSolid, pGeom, pVerts };
    }

    const pools = [buildPool(), buildPool()];

    // ── Per-frame pool update ────────────────────────────────────────────────
    function updatePool(pool, lm) {
      // --- Finger tubes ---
      for (let f = 0; f < FINGERS.length; f++) {
        const { idx, r } = FINGERS[f];
        const tube = pool.tubes[f];

        // Wrist → MCP → PIP → DIP → TIP (smooth CatmullRom curve through all)
        const pts = [mv(lm[0]), ...idx.map(i => mv(lm[i]))];
        const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);

        // Create new TubeGeometry (smooth surface along the curve)
        const newG = new THREE.TubeGeometry(
          curve,
          idx.length * 5,  // tubular segments: more = smoother
          r,               // radius
          8,               // radial segments (sides of tube cross-section)
          false            // open ends
        );

        if (tube._g) tube._g.dispose();
        tube._g = newG;
        tube.solid.geometry = newG;
        tube.wire.geometry  = newG;
        tube.solid.visible  = true;
      }

      // --- Palm grid ---
      const wrist = mv(lm[0]);
      const mcps  = PALM_LMS.map(i => mv(lm[i]));

      for (let row = 0; row < PALM_ROWS; row++) {
        // t: 0.12 (near wrist, slight spread) → 1.0 (at MCPs)
        const t = 0.12 + 0.88 * (row / (PALM_ROWS - 1));

        for (let col = 0; col < PALM_COLS; col++) {
          const mcp  = mcps[col];
          const base = (row * PALM_COLS + col) * 3;
          pool.pVerts[base]     = wrist.x + (mcp.x - wrist.x) * t;
          pool.pVerts[base + 1] = wrist.y + (mcp.y - wrist.y) * t;
          pool.pVerts[base + 2] = wrist.z + (mcp.z - wrist.z) * t;
        }
      }
      pool.pGeom.attributes.position.needsUpdate = true;
      pool.pGeom.computeVertexNormals();
      pool.palmSolid.visible = true;
    }

    function hidePool(pool) {
      for (const t of pool.tubes) t.solid.visible = false;
      pool.palmSolid.visible = false;
    }

    // ── Resize ───────────────────────────────────────────────────────────────
    function onResize() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    onResize();

    // ── Gentle 3D tilt driven by wrist position ──────────────────────────────
    const tilt = { x: 0, y: 0 };

    // ── IPC data ─────────────────────────────────────────────────────────────
    let lastLM   = null;
    let lastLMAt = 0;

    // ── Render loop ──────────────────────────────────────────────────────────
    function animate() {
      const hasHands = !!(lastLM?.hands?.length) &&
                       (performance.now() - lastLMAt) < 200;

      if (hasHands) {
        const lm = lastLM.hands;

        for (let h = 0; h < Math.min(lm.length, MAX_HANDS); h++) {
          updatePool(pools[h], lm[h]);
        }
        for (let h = lm.length; h < MAX_HANDS; h++) {
          hidePool(pools[h]);
        }

        const wrist = lm[0]?.[0];
        if (wrist) {
          tilt.x += ((wrist.y - 0.5) * 0.28 - tilt.x) * 0.06;
          tilt.y += ((0.5 - wrist.x) * 0.28 - tilt.y) * 0.06;
        }

        stage.classList.add('visible');
      } else {
        for (const p of pools) hidePool(p);
        tilt.x *= 0.93;
        tilt.y *= 0.93;
        stage.classList.remove('visible');
      }

      scene.rotation.x = tilt.x;
      scene.rotation.y = tilt.y;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    // ── Receive landmarks from hand-tracking source window via IPC ───────────
    window.iuOS?.onHandsLandmarks?.((payload) => {
      lastLM = payload;
      if (payload?.hands?.length) lastLMAt = performance.now();
    });

    // ── Cleanup ──────────────────────────────────────────────────────────────
    window.addEventListener('beforeunload', () => {
      renderer.dispose();
      faceMat.dispose();
      wireMat.dispose();
    });

    requestAnimationFrame(animate);
  </script>
</body>

</html>
