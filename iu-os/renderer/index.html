<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IÜ OS</title>
  <link rel="stylesheet" href="styles.css">
  <!-- QRCode library (local) -->
  <script src="qrcode.min.js"></script>
  <!-- MediaPipe Tasks Vision (FaceLandmarker with 52 Blendshapes) -->
  <script type="module">
    import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs';
    window.FilesetResolver = FilesetResolver;
    window.FaceLandmarker = FaceLandmarker;
    window.dispatchEvent(new Event('mediapipe-ready'));
  </script>
</head>

<body>
  <div id="app">
    <!-- Bootloader Overlay -->
    <div id="bootloader-overlay">
      <div id="bootloader-sphere"></div>
      <div id="bootloader-buttons">
        <div id="boot-btn-left" class="boot-btn">Paz mental</div>
        <div id="boot-btn-right" class="boot-btn">Tiempo</div>
        <div id="boot-btn-bottom" class="boot-btn">Experto digital</div>
      </div>
      <div id="bootloader-cursor"></div>
    </div>

    <!-- Hidden Video Input for Vision -->
    <video class="input_video" style="display: none;"></video>

    <!-- Navigation HUD -->
    <div id="nav-hud" class="hidden">
      <span id="nav-hud-text">Face</span>
    </div>

    <!-- Neural Graph Canvas -->
    <canvas id="neural-canvas" class="hidden"></canvas>

    <!-- Checklist Overlay -->
    <div id="checklist-container" class="hidden"></div>

    <!-- Intent Carousel Overlay (includes Thinking label) -->
    <div id="intent-carousel" class="hidden">
      <div id="thinking-label">
        <span class="thinking-text">thinking</span>
      </div>
      <div id="intent-track"></div>
      <div id="intent-label"></div>
      <div id="intent-details" class="hidden"></div>
    </div>

    <!-- Loading Overlay for Graph Extraction -->
    <div id="loading-overlay" class="hidden">
      <div class="loading-spinner"></div>
      <div class="loading-text">Generando Grafo UI...</div>
    </div>

    <!-- Face Container - EXACT structure from iü.space -->
    <div id="face-container">
      <svg id="face-svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" aria-label="Ü Face">
        <g id="face-group" transform="translate(200, 250)">
          <!-- Eyebrows -->
          <g id="eyebrows-group">
            <path id="left-eyebrow" class="face-stroke" />
            <path id="right-eyebrow" class="face-stroke" />
          </g>

          <!-- Eyes (minimalist vertical lines) -->
          <g id="eyes-group">
            <g id="left-eye" class="eye-group">
              <path id="left-eye-top" class="face-stroke" />
              <path id="left-eye-line" class="face-stroke" />
              <path id="left-eye-bottom" class="face-stroke" />
            </g>
            <g id="right-eye" class="eye-group">
              <path id="right-eye-top" class="face-stroke" />
              <path id="right-eye-line" class="face-stroke" />
              <path id="right-eye-bottom" class="face-stroke" />
            </g>
          </g>

          <!-- Mouth -->
          <g id="mouth-group">
            <path id="mouth" class="face-stroke" />
          </g>
        </g>
      </svg>

      <!-- Transcript Overlay -->
      <div id="transcript-container" class="hidden">
        <p id="transcript-text"></p>
      </div>
    </div>

    <!-- Chat Toggle Button (top-right) -->
    <button id="btn-chat-toggle" class="chat-toggle-btn" aria-label="Open chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg>
    </button>

    <!-- Menu Toggle Button -->
    <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">
      <span class="menu-icon">☰</span>
    </button>

    <button id="btn-transfer-top" class="transfer-btn-top">
      <span class="transfer-text">Hablar</span>
    </button>

    <!-- Controls Panel -->
    <div id="controls-panel" class="collapsed">
      <!-- <h3>Rol del Dispositivo</h3>
      <div class="button-group role-toggles">
        <button id="role-pc" class="role-toggle">
          <span class="role-icon">🖥️</span>
          <span class="role-label">PC</span>
        </button>
        <button id="role-sensors" class="role-toggle">
          <span class="role-icon">🎙️</span>
          <span class="role-label">Sensores</span>
        </button>
      </div> -->

      <!-- <h3>Expression</h3>
      <div class="button-group">
        <button id="btn-neutral" class="state-btn">Neutral</button>
        <button id="btn-smile" class="state-btn active">Smile</button>
        <button id="btn-thinking" class="state-btn">Thinking</button>
        <button id="btn-wink" class="state-btn">Wink</button>
      </div> -->

      <h3>Theme</h3>
      <div class="button-group">
        <button id="btn-dark" class="theme-btn active">Dark</button>
        <button id="btn-light" class="theme-btn">Light</button>
        <button id="btn-glass" class="theme-btn">Glass</button>
      </div>

      <!-- <h3>Mode</h3>
      <div class="button-group mode-selector">
        <button id="btn-simple-mode" class="mode-btn">
          <span class="mode-icon">⚡</span> Simple Mode
        </button>
        <button id="btn-disconnect-mode" class="mode-btn">
          <span class="mode-icon">🧠</span> Disconnect (1h)
        </button>
      </div> -->

      <h3>Connect</h3>
      <div class="button-group">
        <button id="btn-qr-share" class="connect-btn">Conectar Smartphone</button>
      </div>

      <h3>Modo</h3>
      <div class="button-group">
        <button id="btn-narration-space" class="state-btn"
          style="background:#4ef0ff22; border-color:#4ef0ff; color:#4ef0ff;">Activar Espacio</button>
        <button id="btn-mirar-juntos" class="state-btn"
          style="background:#00f5ff22; border-color:#00f5ff; color:#00f5ff;">Mirar juntos</button>
        <button id="btn-learning-mode" class="state-btn"
          style="background:#ff950022; border-color:#ff9500; color:#ff9500;">Modo Aprendizaje</button>
        <button id="btn-view-learnings" class="state-btn"
          style="background:#66ff9922; border-color:#66ff99; color:#66ff99;">Ver aprendizajes</button>
      </div>

      <div class="status-row" id="connection-status">
        <span class="status-indicator" id="sync-indicator"></span>
        <span id="sync-status-text">Not connected</span>
      </div>
    </div>

    <!-- Compact Mode Popup -->
    <div id="compact-popup">Ejecutando acción...</div>

    <!-- Minimal Learnings Modal -->
    <div id="learnings-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999; align-items:center; justify-content:center;">
      <div style="width:min(760px, 92vw); max-height:78vh; overflow:auto; background:#0f1114; border:1px solid rgba(255,255,255,0.14); border-radius:14px; padding:18px 18px 14px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
          <div style="font-size:18px; font-weight:700; color:#f3f5f7;">Aprendizajes</div>
          <button id="btn-close-learnings" class="state-btn" style="padding:6px 10px;">Cerrar</button>
        </div>
        <div id="learnings-list" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    </div>
  </div>

  <!-- Sync Modules -->
  <script src="node_modules/@picovoice/porcupine-web/index.js"></script>
  <script src="node_modules/@picovoice/web-voice-processor/index.js"></script>
  <script src="sync/DeviceSync.js"></script>
  <script src="sync/QRConnect.js"></script>
  <script src="vision/VisionManager.js"></script>
  <script src="systems/AudioLoop.js"></script>
  <script src="systems/DopamineEngine.js"></script>
  <script src="neural-graph.js"></script>
  <!-- Main App -->
  <script src="app.js"></script>
</body>

</html>
