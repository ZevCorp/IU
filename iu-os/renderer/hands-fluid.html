<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ü Hands Fluid</title>
  <style>
    :root {
      --line: rgba(255, 255, 255, 0.16);
      --text: #f4f7ff;
      --muted: #a4b0c7;
      --ok: #5cff99;
    }

    * { box-sizing: border-box; user-select: none; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "SF Pro Text", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
    }

    #shell {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: radial-gradient(100% 100% at 20% 10%, rgba(78, 240, 255, 0.09), transparent 45%),
        radial-gradient(120% 120% at 100% 100%, rgba(255, 143, 199, 0.08), transparent 50%),
        rgba(5, 7, 12, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.42);
      overflow: hidden;
      opacity: 0;
      transition: opacity 420ms ease;
    }

    #shell.visible { opacity: 1; }

    #titlebar {
      height: 42px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: rgba(12, 14, 20, 0.35);
      -webkit-app-region: drag;
    }

    #title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
      opacity: 0.35;
      transition: opacity 120ms ease;
    }

    #dot.active { opacity: 1; }

    #hide-btn {
      -webkit-app-region: no-drag;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      width: 24px;
      height: 24px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      line-height: 20px;
    }

    #stage {
      position: relative;
      width: 100%;
      height: calc(100% - 42px);
    }

    #hud {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      background: rgba(6, 8, 12, 0.5);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 9px;
      pointer-events: none;
    }

    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>

<body>
  <div id="shell">
    <div id="titlebar">
      <div id="title"><span id="dot"></span><span>Ü Hands Fluid</span></div>
      <button id="hide-btn" aria-label="Hide">×</button>
    </div>
    <div id="stage"></div>
    <div id="hud">
      <span id="status">Waiting hands...</span>
      <span id="meta">0 hands</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';

    const shell = document.getElementById('shell');
    const stage = document.getElementById('stage');
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');
    const dot = document.getElementById('dot');
    const hideBtn = document.getElementById('hide-btn');

    const PARTICLE_COUNT = 14000;
    const POS = new Float32Array(PARTICLE_COUNT * 3);
    const VEL = new Float32Array(PARTICLE_COUNT * 3);
    const TGT = new Float32Array(PARTICLE_COUNT * 3);
    const ALPHA = new Float32Array(PARTICLE_COUNT);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
    camera.position.set(0, 0, 36);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(stage.clientWidth, stage.clientHeight);
    renderer.setClearColor(0x000000, 0);
    stage.appendChild(renderer.domElement);

    const geom = new THREE.BufferGeometry();
    const color = new Float32Array(PARTICLE_COUNT * 3);
    const size = new Float32Array(PARTICLE_COUNT);

    function resetToCloud() {
      for (let i = 0; i < PARTICLE_COUNT; i += 1) {
        const i3 = i * 3;
        const r = 10 + Math.random() * 8;
        const a = Math.random() * Math.PI * 2;
        const y = (Math.random() - 0.5) * 12;

        POS[i3 + 0] = Math.cos(a) * r;
        POS[i3 + 1] = y;
        POS[i3 + 2] = Math.sin(a) * r;

        TGT[i3 + 0] = POS[i3 + 0];
        TGT[i3 + 1] = POS[i3 + 1];
        TGT[i3 + 2] = POS[i3 + 2];

        VEL[i3 + 0] = (Math.random() - 0.5) * 0.2;
        VEL[i3 + 1] = (Math.random() - 0.5) * 0.2;
        VEL[i3 + 2] = (Math.random() - 0.5) * 0.2;

        const cyan = Math.random() > 0.45;
        color[i3 + 0] = cyan ? 0.31 : 1.0;
        color[i3 + 1] = cyan ? 0.94 : 0.56;
        color[i3 + 2] = cyan ? 1.0 : 0.78;

        size[i] = 1.4 + Math.random() * 2.2;
        ALPHA[i] = 0.15;
      }
    }

    resetToCloud();

    geom.setAttribute('position', new THREE.BufferAttribute(POS, 3));
    geom.setAttribute('color', new THREE.BufferAttribute(color, 3));
    geom.setAttribute('size', new THREE.BufferAttribute(size, 1));

    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uPointScale: { value: renderer.getPixelRatio() * 1.9 }
      },
      vertexShader: `
        attribute float size;
        varying vec3 vColor;
        void main() {
          vColor = color;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * uPointScale * (24.0 / max(4.0, -mvPosition.z));
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          vec2 uv = gl_PointCoord - vec2(0.5);
          float d = length(uv);
          float alpha = smoothstep(0.5, 0.0, d);
          gl_FragColor = vec4(vColor, alpha * 0.9);
        }
      `,
      vertexColors: true
    });

    const points = new THREE.Points(geom, material);
    scene.add(points);

    const flow = { t: 0, sceneTiltX: 0, sceneTiltY: 0 };
    let lastHandsData = null;
    let lastHandsAt = 0;
    let prevHasHands = false;

    function onResize() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);

    function handTargetsFromLandmarks(hands) {
      const targets = [];
      const scale = 22;

      for (const hand of hands) {
        if (!hand || hand.length < 21) continue;

        for (const p of hand) {
          const x = (0.5 - p.x) * scale;
          const y = (0.5 - p.y) * scale * 1.2;
          const z = (p.z || 0) * scale * 2.6;
          targets.push([x, y, z]);
        }

        const edges = [
          [0, 1], [1, 2], [2, 3], [3, 4],
          [0, 5], [5, 6], [6, 7], [7, 8],
          [5, 9], [9, 10], [10, 11], [11, 12],
          [9, 13], [13, 14], [14, 15], [15, 16],
          [13, 17], [17, 18], [18, 19], [19, 20],
          [0, 17]
        ];

        for (const [a, b] of edges) {
          const pa = hand[a];
          const pb = hand[b];
          if (!pa || !pb) continue;
          for (let i = 1; i <= 14; i += 1) {
            const t = i / 15;
            const x = (0.5 - (pa.x + ((pb.x - pa.x) * t))) * scale;
            const y = (0.5 - (pa.y + ((pb.y - pa.y) * t))) * scale * 1.2;
            const z = ((pa.z + ((pb.z - pa.z) * t)) || 0) * scale * 2.6;
            targets.push([x, y, z]);
          }
        }

        for (let i = 0; i < 2600; i += 1) {
          const p = hand[Math.floor(Math.random() * hand.length)];
          const x = (0.5 - p.x) * scale + ((Math.random() - 0.5) * 2.4);
          const y = (0.5 - p.y) * scale * 1.2 + ((Math.random() - 0.5) * 2.4);
          const z = ((p.z || 0) * scale * 2.6) + ((Math.random() - 0.5) * 2.4);
          targets.push([x, y, z]);
        }
      }

      return targets;
    }

    function applyTargetsFromHands(hands) {
      const targets = handTargetsFromLandmarks(hands);
      if (!targets.length) return;

      for (let i = 0; i < PARTICLE_COUNT; i += 1) {
        const i3 = i * 3;
        const t = targets[i % targets.length];
        TGT[i3 + 0] = t[0];
        TGT[i3 + 1] = t[1];
        TGT[i3 + 2] = t[2];
        ALPHA[i] = Math.min(1, ALPHA[i] + 0.06);
      }

      const first = hands[0]?.[0];
      if (first) {
        flow.sceneTiltX = ((first.y - 0.5) * 0.5);
        flow.sceneTiltY = ((0.5 - first.x) * 0.5);
      }
    }

    function burstFromEdges() {
      for (let i = 0; i < PARTICLE_COUNT; i += 1) {
        const i3 = i * 3;
        const edge = Math.floor(Math.random() * 4);
        const radius = 24 + Math.random() * 12;
        if (edge === 0) {
          POS[i3 + 0] = -radius;
          POS[i3 + 1] = (Math.random() - 0.5) * 28;
          POS[i3 + 2] = (Math.random() - 0.5) * 14;
        } else if (edge === 1) {
          POS[i3 + 0] = radius;
          POS[i3 + 1] = (Math.random() - 0.5) * 28;
          POS[i3 + 2] = (Math.random() - 0.5) * 14;
        } else if (edge === 2) {
          POS[i3 + 0] = (Math.random() - 0.5) * 28;
          POS[i3 + 1] = radius;
          POS[i3 + 2] = (Math.random() - 0.5) * 14;
        } else {
          POS[i3 + 0] = (Math.random() - 0.5) * 28;
          POS[i3 + 1] = -radius;
          POS[i3 + 2] = (Math.random() - 0.5) * 14;
        }
        VEL[i3 + 0] = (Math.random() - 0.5) * 0.4;
        VEL[i3 + 1] = (Math.random() - 0.5) * 0.4;
        VEL[i3 + 2] = (Math.random() - 0.5) * 0.4;
        ALPHA[i] = 0.02;
      }
    }

    function scatterToEdges() {
      for (let i = 0; i < PARTICLE_COUNT; i += 1) {
        const i3 = i * 3;
        const angle = (i / PARTICLE_COUNT) * Math.PI * 2;
        const radius = 16 + ((i % 37) * 0.17);
        TGT[i3 + 0] = Math.cos(angle) * radius;
        TGT[i3 + 1] = Math.sin(angle) * radius;
        TGT[i3 + 2] = Math.sin(angle * 1.7) * 8;
        ALPHA[i] = Math.max(0.02, ALPHA[i] - 0.06);
      }
    }

    function driftToAir() {
      for (let i = 0; i < PARTICLE_COUNT; i += 1) {
        const i3 = i * 3;
        TGT[i3 + 0] = Math.sin((i * 0.0015) + flow.t) * 14;
        TGT[i3 + 1] = Math.cos((i * 0.0011) + flow.t * 0.8) * 8;
        TGT[i3 + 2] = Math.sin((i * 0.0009) + flow.t * 1.3) * 10;
        ALPHA[i] = Math.max(0.14, ALPHA[i] - 0.004);
      }
      flow.sceneTiltX *= 0.95;
      flow.sceneTiltY *= 0.95;
    }

    function updatePhysics(dt) {
      const hasHands = !!(lastHandsData?.hands?.length) && (performance.now() - lastHandsAt) < 160;
      flow.t += dt * 0.8;

      if (hasHands && !prevHasHands) {
        burstFromEdges();
      } else if (!hasHands && prevHasHands) {
        scatterToEdges();
      }
      prevHasHands = hasHands;

      if (hasHands && lastHandsData?.hands?.length) {
        applyTargetsFromHands(lastHandsData.hands);
      } else {
        driftToAir();
      }

      for (let i = 0; i < PARTICLE_COUNT; i += 1) {
        const i3 = i * 3;

        const px = POS[i3 + 0];
        const py = POS[i3 + 1];
        const pz = POS[i3 + 2];

        const tx = TGT[i3 + 0];
        const ty = TGT[i3 + 1];
        const tz = TGT[i3 + 2];

        const flowX = Math.sin((py * 0.28) + flow.t + i * 0.0007) * 0.14;
        const flowY = Math.cos((px * 0.26) + flow.t * 1.07 + i * 0.0006) * 0.14;
        const flowZ = Math.sin((px * 0.18) + (py * 0.17) + flow.t * 1.18) * 0.14;

        VEL[i3 + 0] = (VEL[i3 + 0] + ((tx - px) * 0.035) + flowX) * 0.92;
        VEL[i3 + 1] = (VEL[i3 + 1] + ((ty - py) * 0.035) + flowY) * 0.92;
        VEL[i3 + 2] = (VEL[i3 + 2] + ((tz - pz) * 0.035) + flowZ) * 0.92;

        POS[i3 + 0] += VEL[i3 + 0];
        POS[i3 + 1] += VEL[i3 + 1];
        POS[i3 + 2] += VEL[i3 + 2];
      }

      geom.attributes.position.needsUpdate = true;

      points.rotation.x += (flow.sceneTiltX - points.rotation.x) * 0.08;
      points.rotation.y += (flow.sceneTiltY - points.rotation.y) * 0.08;
      points.rotation.z += (Math.sin(flow.t * 0.2) * 0.06 - points.rotation.z) * 0.02;

      dot.classList.toggle('active', hasHands);
      shell.classList.toggle('visible', hasHands);
      statusEl.textContent = hasHands ? 'Hands mapped to fluid cloud' : 'Waiting hands...';
      metaEl.textContent = `${lastHandsData?.hands?.length || 0} hands • ${PARTICLE_COUNT} particles`;
    }

    let prevTs = performance.now();
    function animate(ts) {
      const dt = Math.min((ts - prevTs) / 16.666, 2.2);
      prevTs = ts;
      updatePhysics(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.iuOS?.onHandsLandmarks?.((payload) => {
      lastHandsData = payload;
      if (payload?.hands?.length) {
        lastHandsAt = performance.now();
      }
    });

    hideBtn.addEventListener('click', () => {
      window.iuOS?.toggleHandFluidWindow?.();
    });

    window.addEventListener('beforeunload', () => {
      renderer.dispose();
      geom.dispose();
      material.dispose();
    });

    onResize();
    requestAnimationFrame(animate);
  </script>
</body>

</html>
