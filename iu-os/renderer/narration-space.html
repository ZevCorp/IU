<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IÜ Narration Space</title>
    <style>
        @font-face {
            font-family: 'SF Pro Text';
            src: local('SF Pro Text'), local('-apple-system');
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: rgba(6, 8, 12, 0.95);
            color: #f4f7ff;
            font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
        }

        /* Left Panel: Face and Voice Transcript */
        #left-panel {
            width: 30%;
            height: 100%;
            background: rgba(12, 14, 20, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #face-container {
            width: 100%;
            height: 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #face-svg {
            width: 100%;
            max-width: 250px;
            height: auto;
        }

        .face-stroke {
            fill: none;
            stroke: #ffffff;
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Transcript Log */
        #transcript-log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .timeline-item {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            line-height: 1.4;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid transparent;
        }

        .timeline-item.voice {
            border-left-color: #4ef0ff;
        }

        .timeline-item.gesture {
            border-left-color: #ff8fc7;
        }

        .ts {
            font-size: 11px;
            opacity: 0.5;
            margin-bottom: 4px;
            font-family: monospace;
        }

        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 143, 199, 0.2);
            color: #ff8fc7;
            margin-right: 6px;
        }

        /* Controls */
        #controls {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
        }

        #btn-end {
            background: #4ef0ff;
            color: #06080c;
        }

        #btn-end:hover {
            background: #7affff;
        }

        #btn-close {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Right Panel: 3D Body Mesh */
        #right-panel {
            width: 70%;
            height: 100%;
            position: relative;
        }

        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.1;
            /* Very subtle background */
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Synthesis Overlay */
        #synthesis-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 8, 12, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #synthesis-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #synthesis-text {
            font-size: 20px;
            line-height: 1.6;
            max-width: 800px;
            text-align: left;
            color: #f4f7ff;
            margin-bottom: 30px;
            white-space: pre-wrap;
        }

        .loader {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(78, 240, 255, 0.3);
            border-top-color: #4ef0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Floating Labels for Gestures */
        .floating-label {
            position: absolute;
            color: #ff8fc7;
            font-size: 14px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 143, 199, 0.3);
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 0;
            z-index: 20;
        }
    </style>
</head>

<body>

    <div id="left-panel">
        <!-- Face Container -->
        <div id="face-container">
            <svg id="face-svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                <g id="face-group" transform="translate(200, 250)">
                    <!-- Eyebrows -->
                    <g id="eyebrows-group">
                        <path id="left-eyebrow" class="face-stroke" />
                        <path id="right-eyebrow" class="face-stroke" />
                    </g>
                    <!-- Eyes -->
                    <g id="eyes-group">
                        <g id="left-eye" class="eye-group">
                            <path id="left-eye-line" class="face-stroke" />
                        </g>
                        <g id="right-eye" class="eye-group">
                            <path id="right-eye-line" class="face-stroke" />
                        </g>
                    </g>
                    <!-- Mouth -->
                    <g id="mouth-group">
                        <path id="mouth" class="face-stroke" />
                    </g>
                </g>
            </svg>
        </div>

        <!-- Timeline / Transcript Log -->
        <div id="transcript-log">
            <!-- Items will be injected here -->
            <div style="opacity: 0.5; font-size: 12px; text-align: center; margin-top: 20px;">Esperando tu narración...
            </div>
        </div>

        <!-- Controls -->
        <div id="controls">
            <button id="btn-close" class="btn">Cancelar</button>
            <button id="btn-end" class="btn">Sintetizar Narrativa</button>
        </div>
    </div>

    <div id="right-panel">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="floating-label" class="floating-label"></div>
    </div>

    <div id="synthesis-overlay">
        <div id="synthesis-loader" class="loader"></div>
        <div id="synthesis-text">Generando narrativa final...</div>
        <button id="btn-done" class="btn"
            style="background:#4ef0ff; color:#000; width: 200px; display:none;">Cerrar</button>
    </div>

    <script type="module" src="narration-space.js"></script>
</body>

</html>
