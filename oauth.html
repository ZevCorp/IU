<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I&Ü - Iniciar Sesión / Autorizar</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/src/landing.css">
    <link rel="stylesheet" href="/src/dashboard.css">
    <style>
      body {
          overflow: hidden;
      }
      .oauth-scrim {
          background: rgba(0,0,0,0.4);
      }
      .consent-scopes {
          display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 15px;
      }
      .scope-pill {
          background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem;
          color: var(--accent-white); border: 1px solid rgba(255,255,255,0.2);
      }
      .btn-secondary {
          background: transparent; color: var(--text-gray); border: 1px solid var(--border);
      }
      .btn-secondary:hover { background: rgba(255,255,255,0.05); color: white; }
    </style>
</head>
<body>
    <!-- Cinematic Hero Background -->
    <div class="hero-container" style="position:fixed; z-index:0; top:0; left:0; width:100%; height:100%;">
        <video autoplay loop muted playsinline webkit-playsinline class="hero-video" id="main-video"
            poster="/assets/iu_hero.png" preload="auto">
            <source src="/assets/hero_video.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
    </div>

    <!-- Autenticación Overlay -->
    <div class="login-overlay oauth-scrim">
        <div class="login-box">
            
            <div id="loading-view">
                <div class="logo">I<span>&</span>Ü</div>
                <p>Cargando sistema...</p>
            </div>

            <div id="login-view" style="display:none">
                <div class="logo">I<span>&</span>Ü</div>
                <h2 id="login-title">Iniciar Sesión</h2>
                <p id="login-subtitle">Ingresa tus credenciales para continuar</p>
                <form id="login-form" class="login-form">
                    <input type="email" id="email" required autocomplete="email" autofocus placeholder="Tu correo electrónico">
                    <input type="password" id="password" required autocomplete="current-password" placeholder="Contraseña">
                    <button type="submit" class="btn-login-submit">Entrar</button>
                    <p id="login-error" class="error-msg" style="display: none;"></p>
                </form>
            </div>

            <div id="consent-view" style="display:none">
                <div class="logo">I<span>&</span>Ü</div>
                <h2>Solicitud de Acceso</h2>
                <p>La aplicación <strong id="client-name" style="color:white;">--</strong> solicita acceso a tu identidad e interacciones en I&Ü.</p>
                <div class="consent-scopes" id="scopes-list"></div>
                
                <div class="login-form" style="margin-top: 30px;">
                    <button id="btn-approve" class="btn-login-submit">Autorizar App</button>
                    <button id="btn-deny" class="btn-login-submit btn-secondary">Cancelar</button>
                    <p id="consent-error" class="error-msg" style="display: none;"></p>
                </div>
            </div>

            <div id="success-view" style="display:none">
                <div class="logo">I<span>&</span>Ü</div>
                <h2>Conexión Exitosa</h2>
                <p>Has iniciado sesión correctamente en I&Ü.</p>
                <div class="login-form" style="margin-top: 30px;">
                    <button id="btn-dashboard" class="btn-login-submit">Ir al Dashboard</button>
                </div>
            </div>

            <div id="error-view" style="display:none">
                <div class="logo">I<span>&</span>Ü</div>
                <h2>Aviso</h2>
                <p id="error-msg" style="color:#ff4d4d; margin-top:20px; font-size:1rem;"></p>
            </div>

        </div>
    </div>

<script type="module" src="/src/oauth.ts"></script>
</body>
</html>
